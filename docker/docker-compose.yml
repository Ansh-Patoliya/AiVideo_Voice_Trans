version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: transcriber_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: transcriber_user
      POSTGRES_PASSWORD: transcriber_password
      POSTGRES_DB: transcriber_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: transcriber_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: transcriber_backend
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://transcriber_user:transcriber_password@postgres:5432/transcriber_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-production_secure_secret_key_32_characters_long}
    volumes:
      - media_data:/app/backend/media_storage

  celery_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: transcriber_worker
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info"]
    depends_on:
      - postgres
      - redis
    environment:
      DATABASE_URL: postgresql://transcriber_user:transcriber_password@postgres:5432/transcriber_db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      JWT_SECRET: ${JWT_SECRET:-production_secure_secret_key_32_characters_long}
    volumes:
      - media_data:/app/backend/media_storage

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: transcriber_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  media_data:
