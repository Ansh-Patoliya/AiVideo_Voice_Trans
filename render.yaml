databases:
  - name: aivideo-db
    databaseName: transcriber_db
    user: transcriber_user
    plan: free
    region: singapore

services:
  - type: web
    name: aivideo-backend
    runtime: docker
    dockerfilePath: docker/Dockerfile.backend
    dockerContext: .
    plan: free
    region: singapore
    envVars:
      - key: PORT
        value: 8000
      - key: DEBUG
        value: false
      - key: GEMINI_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: aivideo-db
          property: connectionString
